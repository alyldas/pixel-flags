name: Setup project
description: Install Node.js and npm dependencies.

inputs:
  registry-url:
    description: Optional npm registry URL for publish jobs.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Node.js
      if: inputs.registry-url == ''
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
        cache: npm

    - name: Set up Node.js with registry
      if: inputs.registry-url != ''
      uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: npm ci
