name: Verify project
description: Run the shared package and browser verification gates.

inputs:
  verify-package:
    description: Run package verification.
    required: false
    default: "true"
  verify-browser:
    description: Install Chromium and run browser site verification.
    required: false
    default: "false"
  smoke-artifact-dir:
    description: Directory used for browser smoke failure artifacts.
    required: false
    default: reports/smoke
  smoke-artifact-name:
    description: Uploaded browser smoke artifact name.
    required: false
    default: smoke-artifacts

runs:
  using: composite
  steps:
    - name: Verify package
      if: inputs.verify-package == 'true'
      shell: bash
      run: npm run verify:package

    - name: Install Playwright browser
      if: inputs.verify-browser == 'true'
      shell: bash
      run: npm run playwright:install

    - name: Verify browser site
      if: inputs.verify-browser == 'true'
      shell: bash
      env:
        PIXEL_FLAGS_SMOKE_ARTIFACT_DIR: ${{ inputs.smoke-artifact-dir }}
      run: npm run verify:site:smoke

    - name: Upload smoke artifacts on failure
      if: failure() && inputs.verify-browser == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.smoke-artifact-name }}
        path: |
          ${{ inputs.smoke-artifact-dir }}
          site
        if-no-files-found: ignore
