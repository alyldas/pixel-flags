name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run package verification
        uses: ./.github/actions/verify-project

  full:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: fast

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run browser site verification
        uses: ./.github/actions/verify-project
        with:
          verify-package: "false"
          verify-browser: "true"
          smoke-artifact-dir: reports/smoke-ci
          smoke-artifact-name: smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
