name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fast:
    name: Fast Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run package verification
        run: npm run verify:package

  full:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: fast

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Playwright Chrome for Testing
        run: npm run playwright:install

      - name: Run browser site verification
        env:
          PIXEL_FLAGS_SMOKE_ARTIFACT_DIR: reports/smoke-ci
        run: npm run verify:site:smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/smoke-ci
            site
          if-no-files-found: ignore
