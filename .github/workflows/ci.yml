name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fast:
    name: Fast Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run fast verification pipeline
        run: npm run verify

  full:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: fast

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Playwright Chrome for Testing
        run: npx playwright install --with-deps chrome-for-testing

      - name: Run browser smoke test
        env:
          PIXEL_FLAGS_SMOKE_ARTIFACT_DIR: reports/smoke-ci
        run: npm run smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/smoke-ci
            site
          if-no-files-found: ignore
