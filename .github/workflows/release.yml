name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
          include-component-in-tag: false

  publish:
    name: Publish release package
    needs: release-please
    if: >-
      ${{
        always() &&
        (github.event_name == 'workflow_dispatch' ||
          needs.release-please.outputs.release-created == 'true')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Validate release version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PACKAGE_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "Release tag does not match package.json version v${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Validate release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "HEAD" "origin/main"; then
            echo "Release tag is not contained in origin/main." >&2
            exit 1
          fi

      - name: Verify project
        uses: ./.github/actions/verify-project
        with:
          verify-browser: "true"
          smoke-artifact-dir: reports/smoke-release
          smoke-artifact-name: smoke-artifacts-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pack release artifact
        id: package
        run: |
          mkdir -p release-artifacts
          TARBALL=$(npm pack --pack-destination release-artifacts)
          echo "tarball=./release-artifacts/${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error

      - name: Set up GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@alyldas"

      - name: Check GitHub Packages publication
        id: github-published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package to GitHub Packages
        if: steps.github-published.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "${{ steps.package.outputs.tarball }}" --registry=https://npm.pkg.github.com

      - name: Verify GitHub Packages install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:registry
