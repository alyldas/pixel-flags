name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          registry-url: https://registry.npmjs.org

      - name: Detect npm publish secret
        id: npm_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "NPM_TOKEN secret is not configured. npm publish will be skipped."
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate tag version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Validate tag commit is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tagged commit ${GITHUB_SHA} is not contained in origin/main." >&2
            exit 1
          fi

      - name: Install Playwright Chrome for Testing
        run: npx playwright install --with-deps chrome-for-testing

      - name: Run verification pipeline
        run: npm run verify

      - name: Run browser smoke test
        env:
          PIXEL_FLAGS_SMOKE_ARTIFACT_DIR: reports/smoke-release
        run: npm run smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/smoke-release
            site
          if-no-files-found: ignore

      - name: Check whether version is already published
        id: published
        if: steps.npm_token.outputs.available == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package to npm
        if: steps.npm_token.outputs.available == 'true' && steps.published.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PIXEL_FLAGS_R74N_COMMERCIAL_PERMISSION: ${{ secrets.R74N_COMMERCIAL_PERMISSION }}
        run: npm publish --access public --provenance

      - name: Report skipped npm publish
        if: steps.npm_token.outputs.available != 'true'
        run: echo "Skipping npm publish because NPM_TOKEN is not configured."

      - name: Generate release notes from CHANGELOG
        run: node scripts/release-notes.js "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
