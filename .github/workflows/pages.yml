name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Playwright Chrome for Testing
        run: npx playwright install --with-deps chrome-for-testing

      - name: Verify project
        run: npm run verify

      - name: Run browser smoke test
        env:
          PIXEL_FLAGS_SMOKE_ARTIFACT_DIR: reports/smoke-pages
        run: npm run smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/smoke-pages
            site
          if-no-files-found: ignore

      - name: Assemble static site
        run: npm run assemble:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
